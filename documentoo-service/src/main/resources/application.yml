server:
  port: 8082

spring:
  application:
    nome: beneficiario-service
  datasource:
    url: jdbc:h2:mem:beneficiariodb
    driverClassName: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  h2:
    console:
      enabled: true
      path: /h2-console

springdoc:
  swagger-ui:
    path: /swagger-ui.html
